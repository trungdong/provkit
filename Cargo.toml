[workspace]
resolver = "3"
members = ["provkit", "provkit-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/trungdong/provkit"
authors = ["Trung Dong Huynh <trungdong@donggiang.com>"]

[workspace.dependencies]
provkit = { path = "provkit", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = "2"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
assert_cmd = "2"
predicates = "3"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that fight the domain: PROV names repeat their module
# (`json::JsonValue`), and every fallible fn documents its Error in one place.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
