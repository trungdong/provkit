[workspace]
resolver = "3"
members = ["provkit", "provkit-cli"]

# ANCHOR: workspace
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/trungdong/provkit"
# ANCHOR_END: workspace
authors = ["Trung Dong Huynh <trungdong@donggiang.com>"]

# ANCHOR: workspace_dependencies
[workspace.dependencies]
provkit = { path = "provkit", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = "2"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
assert_cmd = "2"
predicates = "3"
# ANCHOR_END: workspace_dependencies

# ANCHOR: lints
[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that fight the domain: PROV names repeat their module
# (`json::JsonValue`), and every fallible fn documents its Error in one place.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
# ANCHOR_END: lints

# ANCHOR: release_profile
# Release binaries: cross-crate optimisation (thin LTO), one codegen unit per
# crate and no symbols. Debug builds are untouched.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
# ANCHOR_END: release_profile
