[package]
name = "provkit-cli"
description = "Command-line tool to convert and compare W3C PROV documents"
readme = "../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# The end-to-end tests read the corpus submodule, which the published crate lacks.
exclude = ["tests/cli.rs"]

[[bin]]
name = "provkit"
path = "src/main.rs"
doc = false

[dependencies]
provkit.workspace = true
clap.workspace = true
anyhow.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true

[lints]
workspace = true
