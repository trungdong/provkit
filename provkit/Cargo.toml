[package]
name = "provkit"
description = "W3C PROV data model with PROV-JSON and PROV-N read and write"
keywords = ["provenance", "prov", "w3c", "prov-n", "prov-json"]
categories = ["data-structures", "parser-implementations", "encoding"]
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# ANCHOR: exclude
# The corpus tests and their data read the corpus submodule, which the
# published crate lacks. `tests/common/` ships, because `provn_round_trip`
# declares it and must compile from the tarball.
exclude = ["tests/corpus_*.rs", "tests/data/"]
# ANCHOR_END: exclude

# ANCHOR: tests
[[test]]
name = "corpus_json"
required-features = ["json"]

[[test]]
name = "corpus_provn"
required-features = ["provn"]

[[test]]
name = "corpus_twins"
required-features = ["json", "provn"]

[[test]]
name = "corpus_probes"
required-features = ["provn"]

[[test]]
name = "provn_round_trip"
required-features = ["provn"]
# ANCHOR_END: tests

# ANCHOR: features
[features]
default = ["json", "provn"]
json = ["dep:serde", "dep:serde_json", "indexmap/serde"]
provn = []
# ANCHOR_END: features

[dependencies]
indexmap.workspace = true
thiserror.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true, features = ["raw_value"] }

[lints]
workspace = true
