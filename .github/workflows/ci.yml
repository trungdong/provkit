name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1 (2026-09-12)
        with:
          # Pinned, so a new lint in a later toolchain does not fail a push that
          # changed no code. Raise it with `rust-version`.
          toolchain: "1.98"
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo package -p provkit
      - run: cargo test --manifest-path "target/package/provkit-$(cargo pkgid -p provkit | sed 's/.*[#@]//')/Cargo.toml"
      - run: cargo test -p provkit --no-default-features --features provn
      - run: cargo test -p provkit --no-default-features --features json
      - run: cargo check -p provkit --no-default-features --tests
        env:
          RUSTFLAGS: -D warnings
      - run: cargo check -p provkit --no-default-features --features provn --tests
        env:
          RUSTFLAGS: -D warnings
      - run: cargo check -p provkit --no-default-features --features json --tests
        env:
          RUSTFLAGS: -D warnings
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo build -p provkit --target wasm32-unknown-unknown
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: crate-ci/typos@00f422f3b19c57bc6338715ebfe3316d38768461 # v1.50.3
