name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Windows runners check out CRLF by default; the tests read LF text.
      - run: git config --global core.autocrlf false
        if: runner.os == 'Windows'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # v1 (2026-11-15)
        with:
          # Pinned, so a new lint in a later toolchain does not fail a push that
          # changed no code. Raise it together with the pins in release.yml and
          # pages.yml.
          toolchain: "1.98"
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo fmt --check
        if: matrix.os == 'ubuntu-latest'
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
        if: matrix.os == 'ubuntu-latest'
      - run: cargo test --workspace --all-features
      - run: cargo package --workspace
        if: matrix.os == 'ubuntu-latest'
      - run: cargo test --manifest-path "target/package/provkit-$(cargo pkgid -p provkit | sed 's/.*[#@]//')/Cargo.toml"
        if: matrix.os == 'ubuntu-latest'
      - run: cargo test -p provkit --no-default-features --features provn
        if: matrix.os == 'ubuntu-latest'
      - run: cargo test -p provkit --no-default-features --features json
        if: matrix.os == 'ubuntu-latest'
      - run: cargo check -p provkit --no-default-features --tests
        env:
          RUSTFLAGS: -D warnings
        if: matrix.os == 'ubuntu-latest'
      - run: cargo check -p provkit --no-default-features --features provn --tests
        env:
          RUSTFLAGS: -D warnings
        if: matrix.os == 'ubuntu-latest'
      - run: cargo check -p provkit --no-default-features --features json --tests
        env:
          RUSTFLAGS: -D warnings
        if: matrix.os == 'ubuntu-latest'
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
        if: matrix.os == 'ubuntu-latest'
      - run: cargo build -p provkit --target wasm32-unknown-unknown
        if: matrix.os == 'ubuntu-latest'
  msrv:
    # Builds and tests with the oldest toolchain the crates support.
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - run: git config --global core.autocrlf false
        if: runner.os == 'Windows'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # v1 (2026-11-15)
        with:
          # The `rust-version` of Cargo.toml. Move the two together.
          toolchain: "1.85"
          targets: wasm32-unknown-unknown
      - run: cargo test --workspace --all-features
      - run: cargo test -p provkit --no-default-features --features provn
        if: matrix.os == 'ubuntu-latest'
      - run: cargo test -p provkit --no-default-features --features json
        if: matrix.os == 'ubuntu-latest'
      - run: cargo check -p provkit --no-default-features --tests
        if: matrix.os == 'ubuntu-latest'
      - run: cargo build -p provkit --target wasm32-unknown-unknown
        if: matrix.os == 'ubuntu-latest'
  clippy-stable:
    # Shows the next toolchain's lints before the pin moves; never blocks.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # v1 (2026-11-15)
        with:
          toolchain: stable
          components: clippy
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: crate-ci/typos@276087d9a4f06398b3e04825487805e2d7375888 # v1.52.2
  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # v1 (2026-11-15)
        with:
          toolchain: "1.98"
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: mdbook@0.5.4
      - run: sh book/build.sh
